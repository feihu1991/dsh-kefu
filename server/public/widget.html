<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>在线客服</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --brand: #4f6ef7;
    --brand2: #7b93ff;
    --bg: #f3f6fd;
    --text: #172035;
    --muted: #7b879f;
    --line: #e3e9f3;
  }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(600px 300px at 50% -10%, rgba(123, 147, 255, .22), transparent 66%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: rgba(255,255,255,.72);
    box-shadow: 0 0 60px rgba(23, 34, 63, .08);
  }
  .head {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 17px 20px;
    color: #fff;
    background: linear-gradient(120deg, #4f6ef7 0%, #7b93ff 58%, #9b6bff 100%);
    box-shadow: 0 10px 28px rgba(79, 110, 247, .26);
  }
  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 15px;
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.34);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
  }
  .head .meta { min-width: 0; }
  .head h1 { font-size: 17px; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .sub { font-size: 12px; opacity: .9; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .head .sub::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7CFFB2;
    box-shadow: 0 0 0 4px rgba(124, 255, 178, .2);
    flex-shrink: 0;
  }
  .body {
    flex: 1;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
    background:
      radial-gradient(460px 260px at 100% 0%, rgba(123, 147, 255, .07), transparent 70%);
  }
  .msg {
    max-width: 80%;
    padding: 11px 15px;
    border-radius: 18px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    animation: msg-in .18s ease;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
    border-bottom-right-radius: 6px;
    box-shadow: 0 8px 18px rgba(79, 110, 247, .22);
  }
  .msg.assistant {
    align-self: flex-start;
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-left-radius: 6px;
    box-shadow: 0 4px 16px rgba(23, 34, 63, .06);
  }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 650; }
  .msg.user .who { color: rgba(255,255,255,.78); }
  .input {
    display: flex;
    gap: 10px;
    padding: 13px 14px calc(13px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.94);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .input textarea {
    flex: 1;
    resize: none;
    height: 54px;
    padding: 11px 13px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #f8fafd;
    color: var(--text);
    font: inherit;
    outline: none;
    transition: border-color .16s, box-shadow .16s, background .16s;
  }
  .input textarea:focus { border-color: var(--brand2); background: #fff; box-shadow: 0 0 0 4px rgba(79, 110, 247, .1); }
  .input button {
    min-width: 72px;
    padding: 0 18px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--brand), var(--brand2));
    color: #fff;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(79, 110, 247, .24);
    transition: transform .14s, box-shadow .14s;
  }
  .input button:hover { transform: translateY(-1px); box-shadow: 0 13px 24px rgba(79, 110, 247, .3); }
  .input button:disabled { opacity: .5; transform: none; box-shadow: none; }
  .tip { text-align: center; color: var(--muted); font-size: 11px; padding: 6px 8px 10px; }
  @keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="avatar">客</div>
    <div class="meta">
      <h1 id="merchant">在线客服</h1>
      <div class="sub" id="agent">正在连接…</div>
    </div>
  </div>
  <div class="body" id="body"></div>
  <div class="input">
    <textarea id="input" placeholder="请输入您的问题…"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="tip">DSH 客服平台 · 智能客服</div>
</div>
<script>
(function () {
  var path = location.pathname;
  var widgetIdx = path.indexOf("/widget/");
  var basePath = widgetIdx >= 0 ? path.slice(0, widgetIdx) : "";
  var token = path.split("/").filter(Boolean).pop();
  var apiBase = basePath + "/api/widget/" + token;
  var VISITOR_KEY = "kefu_visitor";
  function loadVisitor() {
    var stored = localStorage.getItem(VISITOR_KEY);
    if (stored && /\.[0-9a-f]{32}$/.test(stored)) return Promise.resolve(stored);
    return fetch(apiBase + "/visitor").then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error.message);
      localStorage.setItem(VISITOR_KEY, d.data.visitorId);
      return d.data.visitorId;
    });
  }
  var visitorPromise = loadVisitor();
  var body = document.getElementById("body");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var busy = false;

  function add(role, text) {
    var div = document.createElement("div");
    div.className = "msg " + role;
    var who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "我" : (document.getElementById("agent").textContent.split("·")[0].trim() || "客服");
    div.appendChild(who);
    var span = document.createElement("span");
    span.textContent = text;
    div.appendChild(span);
    body.appendChild(div);
    body.scrollTop = body.scrollHeight;
    return span;
  }

  fetch(apiBase + "/config").then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) throw new Error(d.error.message);
    document.getElementById("merchant").textContent = d.data.merchantName;
    document.getElementById("agent").textContent = d.data.agentName + " · " + (d.data.tierName || "智能客服");
    if (d.data.welcomeMessage) add("assistant", d.data.welcomeMessage);
  }).catch(function (e) {
    document.getElementById("agent").textContent = "客服组件不可用";
    add("assistant", "客服暂时无法接入：" + e.message);
  });

  function send() {
    var content = input.value.trim();
    if (!content || busy) return;
    busy = true;
    sendBtn.disabled = true;
    input.value = "";
    add("user", content);
    var pending = add("assistant", "…");
    visitorPromise.then(function (visitorId) {
      return fetch(apiBase + "/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: content, visitorId: visitorId })
      });
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error.message);
      pending.textContent = d.data.message.content;
    }).catch(function (e) {
      pending.textContent = "抱歉，回复失败：" + e.message;
    }).finally(function () {
      busy = false;
      sendBtn.disabled = false;
      body.scrollTop = body.scrollHeight;
    });
  }
  sendBtn.onclick = send;
  input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
})();
</script>
</body>
</html>
