[package]
name = "kefu-client"
version = "0.1.0"
description = "DSH 客服平台桌面客户端"
edition = "2021"

[lib]
name = "kefu_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
